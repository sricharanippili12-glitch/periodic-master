<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Periodic Master — 118 Elements</title>

<style>
:root{
  --bg:#0f1220;
  --panel:#181c33;
  --text:#ffffff;
  --correct:#22c55e;
  --wrong:#ef4444;
  --streak:#38bdf8;
}
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:#11142a;
}
nav button{
  margin-left:10px;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#2b2f55;
  color:white;
  font-weight:600;
}
.page{display:none;padding:25px;}
.page.active{display:block}

/* TABLE */
.table{
  display:grid;
  grid-template-columns:repeat(18,70px);
  gap:5px;
  justify-content:center;
}
.element{
  border-radius:10px;
  padding:6px;
  min-height:75px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.element:hover{transform:scale(1.1)}
.num{font-size:10px;opacity:.7}
.sym{font-size:18px;font-weight:600}
.name{font-size:9px;opacity:.85}

/* COLORS */
.alkali{background:#ff6b6b}
.alkaline{background:#feca57}
.transition{background:#48dbfb}
.post{background:#1dd1a1}
.metalloid{background:#a29bfe}
.nonmetal{background:#54a0ff}
.halogen{background:#ff9ff3}
.noble{background:#c8d6e5;color:#000}
.lanth{background:#ffb142}
.act{background:#ff793f}

/* GAME */
.game-box{
  max-width:600px;
  margin:auto;
  background:var(--panel);
  padding:25px;
  border-radius:20px;
  text-align:center;
}
.options button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2b2f55;
  color:white;
  font-weight:600;
  cursor:pointer;
}
.options button:hover{background:#3f458a}
.feedback{
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  font-weight:700;
  display:none;
}
.correct{background:var(--correct);color:#000}
.wrong{background:var(--wrong);color:#fff}
#nextBtn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:#3f458a;
  color:white;
  font-weight:700;
  cursor:pointer;
  display:none;
}

/* DETAIL */
.detail-box{
  max-width:600px;
  margin:auto;
  background:var(--panel);
  padding:25px;
  border-radius:20px;
}
.detail-box h2{text-align:center;color:#38bdf8}
#backBtn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:#3f458a;
  color:white;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

  <h2>🧪 Periodic Master</h2>
  <nav>
    <button onclick="showPage('table')">Periodic Table</button>
    <button onclick="showPage('game')">Play Game</button>
    <button onclick="location.href='drag.html'">Drag & Drop</button>
  </nav>
</header>

<!-- TABLE -->
<div id="table" class="page active">
  <h2 style="text-align:center">Periodic Table (1–118)</h2>

</div>

<div id="game" class="page">
  <div class="game-box">

    <div class="options" id="opt"></div>
    <div id="feedback" class="feedback"></div>
    <button id="nextBtn" onclick="newQ()">Next</button>
    <p style="margin-top:10px">Score: <span id="score">0</span></p>
  </div>
</div>

<!-- DETAIL -->
<div id="detail" class="page">
  <div class="detail-box">
    <h2 id="dName"></h2>

    <p><b>Period:</b> <span id="dPeriod"></span></p>
    <p><b>Category:</b> <span id="dCat"></span></p>
    <button id="backBtn" onclick="showPage('table')">Back</button>
  </div>
</div>

/* BUILD TABLE */
const table=document.getElementById("ptable");
elements.forEach(e=>{
  const d=document.createElement("div");
  d.className=`element ${e.c}`;
  d.innerHTML=`<div class="num">${e.n}</div>
               <div class="sym">${e.s}</div>
               <div class="name">${e.name}</div>`;
  d.onclick=()=>showDetail(e);
  table.appendChild(d);
});

/* DETAIL */
function showDetail(e){
  showPage('detail');
  dName.innerText=e.name;
  dSymbol.innerText=e.s;
  dAtomic.innerText=e.n;
  dMass.innerText=e.mass || "-";
  dGroup.innerText=e.g;
  dPeriod.innerText=e.p;
  dCat.innerText=e.c;
}

/* GAME */
let score=0,current;
function newQ(){
  feedback.style.display="none";
  nextBtn.style.display="none";
  current=elements[Math.floor(Math.random()*elements.length)];
  q.innerText=`Which group does ${current.name} belong to?`;
  opt.innerHTML="";
  let opts=[current.g];
  while(opts.length<4){
    let r=Math.floor(Math.random()*18)+1;
    if(!opts.includes(r))opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5).forEach(o=>{
    const b=document.createElement("button");
    b.innerText="Group "+o;
    b.onclick=()=>check(o);
    opt.appendChild(b);
  });
}
function check(a){
  feedback.style.display="block";
  nextBtn.style.display="block";
  if(a===current.g){
    score++;
    feedback.className="feedback correct";
    feedback.innerText="Correct!";
  }else{
    feedback.className="feedback wrong";
    feedback.innerText=`Wrong! Correct: Group ${current.g}`;
  }
  scoreEl.innerText=score;
}
newQ();
